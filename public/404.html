<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NativeDefence</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect fix for React Router
      // Stores the current path and redirects to index.html
      var segmentCount = 1; // Number of path segments in your base URL (1 for /NativeDefence/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
